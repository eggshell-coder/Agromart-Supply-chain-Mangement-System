name: Apply Agromart fixes and verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply frontend/backend fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          dashboard = Path('src/components/Dashboard.jsx')
          text = dashboard.read_text(encoding='utf-8')

          import_line = "import { ShipmentsPage as WorkflowShipmentsPage, ProductRequestsPage, NotificationsPage } from './WorkflowPages'"
          if import_line not in text:
              marker = "import { motion } from 'framer-motion'"
              if marker not in text:
                  raise SystemExit('Dashboard import marker not found')
              text = text.replace(marker, marker + "\n" + import_line, 1)

          replacements = {
              "case 'shipments':  return <ShipmentsPage/>": "case 'shipments':  return <WorkflowShipmentsPage/>",
              "case 'product-requests': return <ProductRequestsPage/>": "case 'product-requests': return <ProductRequestsPage/>",
              "case 'notifications':    return <NotificationsPage/>": "case 'notifications':    return <NotificationsPage/>",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          # Fail loudly if the orphaned workflow pages are still unwired.
          if "case 'shipments':  return <WorkflowShipmentsPage/>" not in text:
              raise SystemExit('Workflow ShipmentsPage switch replacement failed')
          if "case 'product-requests': return <ProductRequestsPage/>" not in text:
              raise SystemExit('ProductRequestsPage switch case missing')
          if "case 'notifications':    return <NotificationsPage/>" not in text:
              raise SystemExit('NotificationsPage switch case missing')
          dashboard.write_text(text, encoding='utf-8')

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')
          text = text.replace("import { useEffect, useState } from 'react'", "import { lazy, Suspense, useEffect, useState } from 'react'", 1)
          text = text.replace("import Dashboard from './components/DashboardWithOrderWorkflow'\nimport AdminConsole from './components/AdminConsole'", "const Dashboard = lazy(() => import('./components/DashboardWithOrderWorkflow'))\nconst AdminConsole = lazy(() => import('./components/AdminConsole'))", 1)
          old = "if (screen === 'dashboard') return <><Dashboard onLogout={handleLogout} role={role} /><AdminConsole role={role} /></>"
          new = "if (screen === 'dashboard') return <Suspense fallback={<div className=\"min-h-screen flex items-center justify-center text-sm text-gray-500\">Loading dashboard…</div>}><Dashboard onLogout={handleLogout} role={role} /><AdminConsole role={role} /></Suspense>"
          if old not in text:
              raise SystemExit('App dashboard render marker not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          # DashboardWithOrderWorkflow must not gate order entities on is_active.
          order = Path('src/components/DashboardWithOrderWorkflow.jsx')
          text = order.read_text(encoding='utf-8')
          text = re.sub(r"const activeFarmers = Array\.isArray\(f\) \? f\.filter\(x => x\.is_active && x\.farmer_id\) : \[\]", "const activeFarmers = Array.isArray(f) ? f.filter(x => x.farmer_id) : []", text)
          text = re.sub(r"const activeProducts = Array\.isArray\(p\) \? p\.filter\(x => x\.is_active && x\.product_id\) : \[\]", "const activeProducts = Array.isArray(p) ? p.filter(x => x.product_id) : []", text)
          if 'x.is_active && x.farmer_id' in text or 'x.is_active && x.product_id' in text:
              raise SystemExit('Order modal is_active filter still present')
          order.write_text(text, encoding='utf-8')

          # Cap the analytics shipment query that is polled every 30 seconds.
          server = Path('server.cjs')
          text = server.read_text(encoding='utf-8')
          patterns = [
              (r"supabase\.from\([\"']shipment[\"']\)\.select\([\"']status, delay_hours, start_time[\"']\),", "supabase.from('shipment').select('status, delay_hours, start_time').limit(1000),"),
              (r"supabase\.from\([\"']shipment[\"']\)\.select\(\`status, delay_hours, start_time\`\),", "supabase.from('shipment').select('status, delay_hours, start_time').limit(1000),"),
          ]
          changed = False
          for pattern, replacement in patterns:
              text2, n = re.subn(pattern, replacement, text, count=1)
              if n:
                  text = text2
                  changed = True
                  break
          if not changed and '.select(\'status, delay_hours, start_time\')' not in text and '.select("status, delay_hours, start_time")' not in text:
              raise SystemExit('Analytics shipment query marker not found')
          server.write_text(text, encoding='utf-8')

          # Convert public PNG assets to smaller WebP files and update text references.
          # Originals are retained so this remains reversible.
          try:
              from PIL import Image
          except ImportError:
              raise SystemExit('Pillow is required for image optimization')

          pngs = list(Path('public').rglob('*.png'))
          for src in pngs:
              dst = src.with_suffix('.webp')
              with Image.open(src) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA')
                  max_width = 1600
                  if im.width > max_width:
                      ratio = max_width / im.width
                      im = im.resize((max_width, max(1, round(im.height * ratio))), Image.Resampling.LANCZOS)
                  im.save(dst, 'WEBP', quality=78, method=6)

          for root in [Path('src'), Path('public')]:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() in {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico'}:
                      continue
                  try:
                      s = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  ns = re.sub(r'(?i)\.png(?=[\"\'\)\s?#])', '.webp', s)
                  if ns != s:
                      p.write_text(ns, encoding='utf-8')

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify critical source wiring
        shell: bash
        run: |
          grep -q "WorkflowShipmentsPage" src/components/Dashboard.jsx
          grep -q "ProductRequestsPage" src/components/Dashboard.jsx
          grep -q "NotificationsPage" src/components/Dashboard.jsx
          grep -q "limit(1000)" server.cjs
          grep -q "f.filter(x => x.farmer_id)" src/components/DashboardWithOrderWorkflow.jsx
          grep -q "p.filter(x => x.product_id)" src/components/DashboardWithOrderWorkflow.jsx
          test -d dist
          echo "Critical wiring and build verification passed."

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server.cjs public/images public/*.webp .github/workflows/fix-and-verify.yml || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: complete workflow wiring and performance fixes [skip ci]"
            git push
          fi
